[package]
name = "plazr-billiards"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Open-source, modular 2D/3D billiards physics simulation engine by the Plazr platform."
readme = "README.md"
repository = "https://github.com/plazr/plazr-billiards"
keywords = ["billiards", "pool", "physics", "simulation", "wasm"]
categories = ["simulation", "game-development", "science", "wasm"]
publish = false

[lib]
name = "plazr_billiards"
path = "src/lib.rs"
# Enable both standard Rust library linkage (`rlib`) and dynamic C/WASM linkage (`cdylib`)
# for future WebAssembly compilation targets (`wasm32-unknown-unknown`).
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Reserved feature flag for Phase 2+ WebAssembly bindings (e.g., wasm-bindgen integration).
wasm = []

[dependencies]
# Phase 1 strictly keeps zero external dependencies to preserve core independence.
